[package]
name = "blogger-poster"
version = "0.1.0"
description = "Blogger Poster — visual editor + browser image upload + Blogger API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "blogger_poster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger = "0.11"
blogger-client = { path = "../crates/blogger" }
blogger-cdp = { path = "../crates/cdp" }
blogger-python = { path = "../crates/python-bridge" }
