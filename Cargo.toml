[workspace]
resolver = "2"
members = [
    "crates/cdp",
    "crates/blogger",
    "crates/python-bridge",
    "src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2